<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Andrea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: texto suelto sobre un claro del bosque; título con "te quiero" en rosa, la razón escrita a mano como protagonista */
:root{
  --bg:#dfeadb; --sky:#eef4ea; --pine1:#a9c6a6; --pine2:#7ba481; --pine3:#4d7a5a;
  --ink:#16281d; --muted:#557060; --pink:#c2185b; --glow:#c99a2e; --halo:rgba(238,244,234,.9);
  --f-display:"Gloock", Georgia, serif;
  --f-body:"Figtree", system-ui, sans-serif;
  --f-hand:"Caveat", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08130e; --sky:#0f2219; --pine1:#163223; --pine2:#0f2619; --pine3:#081a10;
  --ink:#ecf6ee; --muted:#93b5a0; --pink:#ff6f9b; --glow:#f3d873; --halo:rgba(8,19,14,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08130e; --sky:#0f2219; --pine1:#163223; --pine2:#0f2619; --pine3:#081a10;
  --ink:#ecf6ee; --muted:#93b5a0; --pink:#ff6f9b; --glow:#f3d873; --halo:rgba(8,19,14,.85); color-scheme:dark}

html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#forest{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:44px 64px;display:grid;gap:26px;
  text-shadow:0 0 18px var(--halo),0 0 4px var(--halo)}

header{display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,7vw,42px);line-height:1.05;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--pink)}

.note{display:grid;gap:8px}
h1{min-height:4.3em}
.reason{transition:opacity .3s ease}
.reason.swap{opacity:0}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;
  font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sign{font-family:var(--f-hand);font-size:26px;color:var(--pink)}

.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:600 15px/1 var(--f-body);border-radius:999px;padding:13px 22px;cursor:pointer;border:1.5px solid var(--pink);text-shadow:none}
.primary{background:var(--pink);color:var(--sky)}
.ghost{background:transparent;color:var(--pink)}
button:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
button:active{transform:scale(.97)}

footer{font-size:13px;color:var(--muted)}
.countdown{margin:0;font-size:14px;color:var(--muted);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.countdown span{font-family:var(--f-display);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){.reason{transition:none}}
</style>

</head>
<body>
<canvas id="forest" aria-hidden="true"></canvas>

<main>
  <header>
    <span class="eyebrow" id="fecha">—</span>
    <h1 aria-live="polite"><em>Andrea</em>, te amo porque <em class="reason" id="reason">…</em></h1>
  </header>
  <p class="countdown"><span id="cd">--:--:--</span></p>

</main>

<script>
/* ====== EDITA AQUÍ ====== */
const CONFIG = {
  inicio: "2026-10-27"   // el día 1
};

// Ejemplos. Cada una completa la frase "Te amo porque…"
const RAZONES = [
  "webos",
  "tienes unos ojos preciosos",
  "estás cagadilla",
  "tienes una sonrisa preciosa",
  "me amas",
  "me haces sentir feliz",
  "me das tranquilidad"
];
/* ====== FIN DE LO EDITABLE ====== */

const $ = id => document.getElementById(id);
const DAY = 86400000;

function hoyIndex(){
  const [y,m,d] = CONFIG.inicio.split("-").map(Number);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.max(0, Math.round((now - new Date(y, m-1, d)) / DAY));
}
let idx = -1;
function pintarDia(){
  const nuevo = hoyIndex();
  if (nuevo === idx) return;
  const r = $("reason");
  const aplicar = () => {
    r.textContent = RAZONES[nuevo % RAZONES.length];
    $("fecha").textContent = new Date().toLocaleDateString("es-MX", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
    r.classList.remove("swap");
  };
  if (idx === -1) aplicar(); else { r.classList.add("swap"); setTimeout(() => { aplicar(); burst(); }, 300); }
  idx = nuevo;
}
const pad = n => String(n).padStart(2, "0");
function tick(){
  const now = new Date();
  const manana = new Date(now); manana.setHours(24, 0, 0, 0);
  const s = Math.max(0, Math.floor((manana - now) / 1000));
  $("cd").textContent = `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
  pintarDia();
}
tick();
setInterval(tick, 1000);

/* ====== Bosque: pinos en capas + luciérnagas ====== */
const cv = $("forest"), ctx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, dpr = 1, colors = {}, flies = [], layers = [];

function seeded(s){ return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function readColors(){
  const cs = getComputedStyle(document.documentElement);
  ["sky","bg","pine1","pine2","pine3","glow"].forEach(k => colors[k] = cs.getPropertyValue("--"+k).trim());
}
function buildLayers(){
  const rnd = seeded(42);
  layers = [
    { c:"pine1", base:.70, h:[.16,.28], gap:[34,60] },
    { c:"pine2", base:.80, h:[.20,.34], gap:[44,80] },
    { c:"pine3", base:.92, h:[.26,.42], gap:[60,110] }
  ].map(L => {
    const trees = []; let x = -40;
    while (x < W + 60){ trees.push({ x, h: (L.h[0] + rnd()*(L.h[1]-L.h[0])) * H, w: .34 + rnd()*.14 }); x += L.gap[0] + rnd()*(L.gap[1]-L.gap[0]); }
    return { ...L, trees };
  });
}
function pine(x, baseY, h, wr){
  const tiers = 4, w = h * wr;
  ctx.beginPath();
  for (let t = 0; t < tiers; t++){
    const top = baseY - h + (h * t / tiers) * .85;
    const bot = top + h * .42;
    const half = w * (.45 + t * .2) / 2;
    ctx.moveTo(x, top); ctx.lineTo(x + half, bot); ctx.lineTo(x - half, bot); ctx.closePath();
  }
  ctx.rect(x - w*.05, baseY - h*.1, w*.1, h*.12);
  ctx.fill();
}
function drawForest(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, colors.sky); g.addColorStop(1, colors.bg);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for (const L of layers){
    ctx.fillStyle = colors[L.c];
    const by = H * L.base;
    for (const t of L.trees) pine(t.x, by, t.h, t.w);
    ctx.fillRect(0, by, W, H - by);
  }
}
function makeFlies(n){
  const rnd = Math.random;
  flies = Array.from({length:n}, () => ({
    x: rnd()*W, y: H*(.35 + rnd()*.6), r: 1.2 + rnd()*1.8,
    a: rnd()*Math.PI*2, s: .15 + rnd()*.35, ph: rnd()*Math.PI*2, life: Infinity
  }));
}
function burst(){
  if (reduce) return;
  const cx = W/2, cy = Math.min(H*.45, 360);
  for (let i = 0; i < 14; i++){
    const a = Math.random()*Math.PI*2, s = 1 + Math.random()*2;
    flies.push({ x:cx, y:cy, r:1.4+Math.random()*1.6, a, s, ph:Math.random()*6, life:90, vx:Math.cos(a)*s, vy:Math.sin(a)*s });
  }
}
function frame(t){
  drawForest();
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  flies = flies.filter(f => f.life > 0);
  for (const f of flies){
    if (f.vx !== undefined){ f.x += f.vx; f.y += f.vy; f.vx *= .97; f.vy *= .97; f.life--; }
    else { f.a += (Math.random()-.5)*.2; f.x += Math.cos(f.a)*f.s; f.y += Math.sin(f.a)*f.s*.6;
      if (f.x < -10) f.x = W+10; if (f.x > W+10) f.x = -10; if (f.y < H*.3) f.a = Math.PI/2; if (f.y > H) f.a = -Math.PI/2; }
    const pulse = .45 + .55 * Math.max(0, Math.sin(t/700 + f.ph));
    const alpha = (f.life === Infinity ? 1 : f.life/90) * pulse;
    const rg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r*7);
    rg.addColorStop(0, colors.glow); rg.addColorStop(1, "transparent");
    ctx.globalAlpha = alpha * .55; ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r*7, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = alpha; ctx.fillStyle = colors.glow;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  if (!reduce) requestAnimationFrame(frame);
}
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  buildLayers(); makeFlies(Math.round(Math.min(40, W/22)));
  if (reduce) frame(0);
}
readColors(); resize();
addEventListener("resize", resize);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); if (reduce) frame(0); });
new MutationObserver(() => { readColors(); if (reduce) frame(0); }).observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
if (!reduce) requestAnimationFrame(frame);
</script>

</body>
</html>
